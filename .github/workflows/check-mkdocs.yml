name: Check MkDocs Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Check build configuration
        run: |
          if [ ! -f "pyproject.toml" ]; then
            echo "Error: pyproject.toml not found! Cannot build docs."
            exit 1
          fi
          echo "✅ Build configuration file (pyproject.toml) found."

      - name: Install Only MkDocs Dependencies
        # mkdocstrings resolves ``ffpa_attn`` from the sources (``paths`` in
        # mkdocs.yml), so the package itself -- and therefore torch, ray and
        # the CUDA extension -- is never installed on the docs runner.
        run: |
          pip install -r docs/requirements.txt

      # Build MkDocs documentation with strict mode and fail it if the
      # logs contain 'WARNING', 'aborted', 'ERROR', or do not contain
      # 'Documentation built'.
      - name: Build MkDocs Documentation Strictly
        run: |
          mkdocs build --strict 2>&1 | tee build.log
          if grep -E 'WARNING|aborted|abort|ERROR' build.log; then
            echo "MkDocs build failed due to warnings or errors."
            exit 1
          elif ! grep -q 'Documentation built' build.log; then
            echo "MkDocs build did not complete successfully."
            exit 1
          else
            echo "MkDocs build completed successfully!"
          fi

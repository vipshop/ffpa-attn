# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# The site build only needs the MkDocs toolchain. mkdocstrings reads the
# ``src/ffpa_attn`` sources statically (``paths`` in mkdocs.yml), so
# ffpa-attn itself is never installed -- no torch, no ray, no CUDA extension
# and no setuptools-scm version derivation (hence no full git checkout).
python:
  install:
    - requirements: docs/requirements.txt

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

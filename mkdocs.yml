site_name: FFPA - Faster Flash Prefill Attention for Large Headdim
site_description: FFPA — Yet another Faster Flash Prefill Attention for large headdim with O(1) GPU SRAM complexity.
site_url: https://ffpa-attn.readthedocs.io
site_author: FFPA-Attn Team

repo_url: https://github.com/vipshop/ffpa-attn
repo_name: vipshop/ffpa-attn
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-2
        name: Switch to system preference
  features:
    - content.action.edit
    - content.code.copy
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs
    - content.tooltips
    - toc.follow

nav:
  - Home: index.md
  - User Guide:
      - Backends Overview: user_guide/backends/overview.md
      - CUDA Backend: user_guide/backends/cuda.md
      - Triton Backend: user_guide/backends/triton.md
      - CuTe-DSL Backend: user_guide/backends/cutedsl.md
      - FP8 / FP4 Attention: user_guide/quantized.md
      - Triton Autotune: user_guide/autotune.md
  - Bench: bench/README.md
  - Env Vars: env.md
  - Developer Guide:
      - Pre-commit Hook: developer_guide/pre-commit.md
  - API Reference: api/ffpa_attn.md

plugins:
  - search
  - callouts
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_signature_annotations: true
            separate_signature: true
            group_by_category: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - fenced_code
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vipshop/ffpa-attn
